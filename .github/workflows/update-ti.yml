name: update-threat-intel

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: threat-intel-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Debug secret injected
        env:
          THREATFOX_AUTH_KEY: ${{ secrets.THREATFOX_AUTH_KEY }}
        run: |
          python - <<'PY'
          import os
          v = os.getenv("THREATFOX_AUTH_KEY", "")
          print("THREATFOX_AUTH_KEY present =", bool(v))
          print("THREATFOX_AUTH_KEY length =", len(v))
          PY

      - name: Debug ThreatFox direct request
        env:
          THREATFOX_AUTH_KEY: ${{ secrets.THREATFOX_AUTH_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          key = os.getenv("THREATFOX_AUTH_KEY", "")
          req = urllib.request.Request(
              "https://threatfox-api.abuse.ch/api/v1/",
              data=json.dumps({"query": "get_iocs", "days": 1}).encode(),
              headers={
                  "User-Agent": "fadouse-ti-builder/diag",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "Auth-Key": key,
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read().decode("utf-8", errors="replace")
                  print("status =", resp.status)
                  print("content-type =", resp.headers.get("Content-Type", ""))
                  print("body preview =", repr(body[:500]))
          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", errors="replace")
              print("HTTPError =", e.code)
              print("body preview =", repr(body[:500]))
              raise
          except Exception as e:
              print("Exception =", repr(e))
              raise
          PY

      - name: Build feeds
        env:
          THREATFOX_DAYS: "3"
          THREATFOX_CONFIDENCE: "90"
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          THREATFOX_AUTH_KEY: ${{ secrets.THREATFOX_AUTH_KEY }}
          VT_ENRICH_LIMIT: "20"
          VT_MIN_SCORE: "5"
          PUP_FILTER_URL: "https://raw.githubusercontent.com/curbengh/pup-filter/main/dist/pup-filter-dnscrypt-blocked-names.txt"
        run: |
          python scripts/build_ti.py

      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add clash/generated yara intel meta inputs
          git commit -m "chore: update threat intelligence feeds"
          git push
