name: update-threat-intel

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: threat-intel-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feeds
        env:
          THREATFOX_DAYS: "3"
          THREATFOX_CONFIDENCE: "50"
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          THREATFOX_AUTH_KEY: ${{ secrets.THREATFOX_AUTH_KEY }}
          VT_ENRICH_LIMIT: "20"
          VT_MIN_SCORE: "5"
          # This upstream is unstable; the script continues even if it fails
          PUP_FILTER_URL: "https://raw.githubusercontent.com/curbengh/pup-filter/main/dist/pup-filter-dnscrypt-blocked-names.txt"
        run: |
          python scripts/build_ti.py

      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add clash/generated yara intel meta inputs
          git commit -m "chore: update threat intelligence feeds"
          git push
